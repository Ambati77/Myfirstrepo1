<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Paragraph of text -->
    <p>This is a sample paragraph of text on a basic HTML webpage.</p>

    <!-- Hyperlink -->
    <p>Visit <a href="https://wikipedia.org" target="_blank">Wikipedia</a> for more information.</p>

    <!-- Unordered List -->
    <h3>My Favorite Fruits</h3>
    <ul>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Oranges</li>
    </ul>

</body>
</html>
